theme = "transparent"

[editor]
color-modes = true
end-of-line-diagnostics = "hint"
line-number = "relative"
rainbow-brackets = true
rulers = []
shell = ["fish", "-c"]
trim-trailing-whitespace = true
true-color = true
undercurl = true

[editor.auto-save]
focus-lost = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.indent-guides]
character = "▏"
render = true
skip-levels = 1

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.lsp]
display-color-swatches = true
display-inlay-hints = false

[editor.statusline]
diagnostics = ["info", "hint", "warning", "error"]
workspace-diagnostics = ["warning", "error"]

[editor.statusline.mode]
insert = "INSERT"
normal = "NORMAL"
select = "SELECT"

[keys.insert]
S-tab = "move_parent_node_start"

[keys.normal]
A-b = "move_prev_sub_word_start"
A-e = "move_next_sub_word_end"
A-tab = "goto_next_buffer"
A-w = "move_next_sub_word_start"
C-r = ":reload-all"
D = "@vgld"
H = "@vgs"
L = "@vgl"
S-tab = "move_parent_node_start"
X = "select_line_above"
Y = "@vgly"
c = ["trim_selections", "change_selection"]
esc = ["collapse_selection", "keep_primary_selection"]
ret = "goto_word"
tab = "move_parent_node_end"

[keys.normal.space]
"." = "vsplit_new"
E = [":sh rm -f /tmp/unique-file-h21a434", ":insert-output yazi '%{workspace_directory}' --chooser-file=/tmp/unique-file-h21a434", ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty', ":open %sh{cat /tmp/unique-file-h21a434}", ":redraw", ":set mouse false", ":set mouse true"]
e = [":sh rm -f /tmp/unique-file-u41ae14", ":insert-output yazi '%{buffer_name}' --chooser-file=/tmp/unique-file-u41ae14", ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty', ":open %sh{cat /tmp/unique-file-u41ae14}", ":redraw", ":set mouse false", ":set mouse true"]
space = "file_picker"
t = "@<space>/TODO|FIX|FIXME|OPTIMIZE|NOTE|HINT"

[keys.normal.space.b]
b = "buffer_picker"
o = ":buffer-close-others"
q = ":buffer-close"

[keys.normal.space.c]
c = "@:sh just build"
r = "@:sh just run"

[keys.normal.space.f]
s = ":write"

[keys.normal.space.g]
b = ":sh git -C $(dirname $(realpath %{buffer_name})) blame -L %{cursor_line},%{cursor_line} $(realpath %{buffer_name})"
g = [":write-all", ":insert-output lazygit >/dev/tty", ":redraw", ":reload-all"]

[keys.normal.space.q]
q = ":quit!"
w = ":write-quit-all"

[keys.normal.space.u]
h = ":toggle lsp.display-inlay-hints"
s = ":toggle lsp.auto-signature-help"
w = ":toggle soft-wrap.enable"

[keys.select]
S-tab = "extend_parent_node_start"
tab = "extend_parent_node_end"

