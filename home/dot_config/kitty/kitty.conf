# Generated by Home Manager.
# See https://sw.kovidgoyal.net/kitty/conf.html
include themes/Catppuccin-Mocha.conf

# Shell integration is sourced and configured manually
shell_integration no-rc

allow_remote_control yes
background #11111b
background_blur 1
background_opacity 0.7
bold_font auto
confirm_os_window_close 0
cursor_beam_thickness 0.3
cursor_shape beam
cursor_shape_unfocused hollow
cursor_trail 1
cursor_underline_thickness 1.5
enabled_layouts tall,stack
font_family family='Fira Code' postscript_name=FiraCode-Regular
font_size 13.0
hide_window_decorations yes
shell fish
symbol_map U+23FB-U+23FE,U+2630,U+2665,U+26A1,U+276C-U+2771,U+2B58,U+E000-U+E00A,U+E0A0-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B8,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+EFCE,U+F000-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono
tab_bar_edge bottom
tab_bar_min_tabs 2
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {title}
update_check_interval 0
window_padding_width 5 10

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map ctrl+alt+1 combine : close_session . : goto_session ~/.config/kitty/sessions/dotfiles.kitty-session
map ctrl+alt+2 combine : close_session . : goto_session ~/.config/kitty/sessions/nvim.kitty-session
map ctrl+alt+3 combine : close_session . : goto_session ~/.config/kitty/sessions/ammix-os.kitty-session
map ctrl+alt+e launch --type=overlay --cwd=current yazi
map ctrl+alt+enter new_window
map ctrl+alt+g launch --type=overlay --cwd=current lazygit
map ctrl+alt+q close_session .
map ctrl+alt+s goto_session
map ctrl+alt+w save_as_session .
map ctrl+enter launch --cwd=current
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right
map ctrl+shift+z next_layout
map ctrl+t new_tab_with_cwd
