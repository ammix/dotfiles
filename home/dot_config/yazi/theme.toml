[app]
overall = { bg = "reset" }

[mgr]
cwd = { fg = "#94e2d5" }

find_keyword  = { fg = "#f9e2af", italic = true }
find_position = { fg = "#f5c2e7", bg = "reset", italic = true }

marker_copied   = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut      = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked   = { fg = "#94e2d5", bg = "#94e2d5" }
marker_selected = { fg = "#b4befe", bg = "#b4befe" }

count_copied   = { fg = "#1e1e2e", bg = "#a6e3a1" }
count_cut      = { fg = "#1e1e2e", bg = "#f38ba8" }
count_selected = { fg = "#1e1e2e", bg = "#b4befe" }

border_symbol = "│"
border_style  = { fg = "#7f849c" }

syntect_theme = "~/.config/yazi/Catppuccin-mocha.tmTheme"

[tabs]
active   = { fg = "#1e1e2e", bg = "#cdd6f4", bold = true }
inactive = { fg = "#cdd6f4", bg = "#45475a" }

[mode]
normal_main = { fg = "#1e1e2e", bg = "#b4befe", bold = true }
normal_alt  = { fg = "#b4befe", bg = "#313244"}

select_main = { fg = "#1e1e2e", bg = "#a6e3a1", bold = true }
select_alt  = { fg = "#a6e3a1", bg = "#313244"}

unset_main  = { fg = "#1e1e2e", bg = "#f2cdcd", bold = true }
unset_alt   = { fg = "#f2cdcd", bg = "#313244"}

[indicator]
parent = { fg = "#1e1e2e", bg = "#cdd6f4" }
current = { fg = "#1e1e2e", bg = "#b4befe" }
preview = { fg = "#1e1e2e", bg = "#cdd6f4" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#a6e3a1", bg = "#45475a" }
progress_error  = { fg = "#f9e2af", bg = "#f38ba8" }

perm_type  = { fg = "#89b4fa" }
perm_read  = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec  = { fg = "#a6e3a1" }
perm_sep   = { fg = "#7f849c" }

[input]
border   = { fg = "#b4befe" }
title    = {}
value    = {}
selected = { reversed = true }

[pick]
border   = { fg = "#b4befe" }
active   = { fg = "#f5c2e7" }
inactive = {}

[confirm]
border     = { fg = "#b4befe" }
title      = { fg = "#b4befe" }
body       = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}

[cmp]
border = { fg = "#b4befe" }

[tasks]
border  = { fg = "#b4befe" }
title   = {}
hovered = { fg = "#f5c2e7", bold = true }

[which]
mask            = { bg = "#313244" }
cand            = { fg = "#94e2d5" }
rest            = { fg = "#9399b2" }
desc            = { fg = "#f5c2e7" }
separator       = "  "
separator_style = { fg = "#585b70" }

[help]
on      = { fg = "#94e2d5" }
run     = { fg = "#f5c2e7" }
desc    = { fg = "#9399b2" }
hovered = { bg = "#585b70", bold = true }
footer  = { fg = "#cdd6f4", bg = "#45475a" }

[notify]
title_info  = { fg = "#94e2d5" }
title_warn  = { fg = "#f9e2af" }
title_error = { fg = "#f38ba8" }

[filetype]
rules = [
	# Media
	{ mime = "image/*", fg = "#f9e2af" },
	{ mime = "{audio,video}/*", fg = "#f5c2e7" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f38ba8" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#89dceb" },

	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#45475a" },

	# Special file
	{ url = "*", is = "orphan", bg = "#f38ba8" },
	{ url = "*", is = "exec"  , fg = "#a6e3a1" },

	# Dummy file
	{ url = "*", is = "dummy", bg = "#f38ba8" },
	{ url = "*/", is = "dummy", bg = "#f38ba8" },

	# Fallback
	{ url = "*/", fg = "#b4befe" },
]

[spot]
border = { fg = "#b4befe" }
title  = { fg = "#b4befe" }
tbl_cell = { fg = "#b4befe", reversed = true }
tbl_col = { bold = true }

[icon]
dirs = [
	{ name = ".config", text = "", fg = "#b4befe" },
	{ name = ".git", text = "", fg = "#b4befe" },
	{ name = ".github", text = "", fg = "#b4befe" },
	{ name = ".npm", text = "", fg = "#b4befe" },
	{ name = "Desktop", text = "", fg = "#b4befe" },
	{ name = "Development", text = "", fg = "#b4befe" },
	{ name = "Documents", text = "", fg = "#b4befe" },
	{ name = "Downloads", text = "", fg = "#b4befe" },
	{ name = "Library", text = "", fg = "#b4befe" },
	{ name = "Movies", text = "", fg = "#b4befe" },
	{ name = "Music", text = "", fg = "#b4befe" },
	{ name = "Pictures", text = "", fg = "#b4befe" },
	{ name = "Public", text = "", fg = "#b4befe" },
	{ name = "Videos", text = "", fg = "#b4befe" },
]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#cdd6f4" },
	{ if = "link", text = "", fg = "#a6adc8" },
	{ if = "block", text = "", fg = "#f9e2af" },
	{ if = "char", text = "", fg = "#f9e2af" },
	{ if = "fifo", text = "", fg = "#f9e2af" },
	{ if = "sock", text = "", fg = "#f9e2af" },
	{ if = "sticky", text = "", fg = "#f9e2af" },
	{ if = "dummy", text = "", fg = "#f38ba8" },

	# Fallback
	{ if = "dir", text = "", fg = "#b4befe" },
	{ if = "exec", text = "", fg = "#a6e3a1" },
	{ if = "!dir", text = "", fg = "#cdd6f4" },
]
